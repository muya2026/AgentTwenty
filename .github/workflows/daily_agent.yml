name: Daily AgentTwenty Execution

on:
  schedule:
    # Runs every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # Pulls secrets stored under the "GROQ_API_KEY" environment (where the
    # Groq key was added). Repository secrets still flow in as before.
    environment: GROQ_API_KEY

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AgentTwenty Orchestrator
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQAPI: ${{ secrets.GROQAPI }}
          GROQ: ${{ secrets.GROQ }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # Fail the run unless a REAL post + comment were published on Moltbook.
          # This prevents the old "green checkmark, zero real actions" problem.
          REQUIRE_REAL_ACTIONS: "true"
        run: python main.py

      - name: Upload Generated Reports (Artifact)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: daily-reports
          path: ./data/
          retention-days: 5
          if-no-files-found: ignore
